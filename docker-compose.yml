name: biome-rivals-local

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_USER: ${POSTGRES_USER:-nakama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.40.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up --database.address ${POSTGRES_USER:-nakama}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-nakama}
        exec /nakama/nakama \
          --name biome-rivals-local \
          --database.address ${POSTGRES_USER:-nakama}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-nakama} \
          --logger.level DEBUG \
          --runtime.path /nakama/data/modules \
          --socket.server_key ${NAKAMA_SERVER_KEY:-local_only_change_me} \
          --console.username ${NAKAMA_CONSOLE_USERNAME:-admin} \
          --console.password ${NAKAMA_CONSOLE_PASSWORD:-local_only_change_me}
    volumes:
      - ./server-nakama/build:/nakama/data/modules:ro
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    restart: unless-stopped

volumes:
  postgres-data:
